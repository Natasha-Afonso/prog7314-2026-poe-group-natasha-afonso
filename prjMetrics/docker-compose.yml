services:
  metrix-db-service:
    build:
      context: .
      dockerfile: ./MetrixDB/Dockerfile
    container_name: metrix-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password1!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - metrix_db_data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - metrix-network

  # frontend-service:
  #     build:
  #       context: .
  #       dockerfile: ./ReactFrontend/securityWeb/frontend/Dockerfile           
  #     container_name: smart-frontend
  #     ports:
  #       - "8081:8080"                             # <-- Droplet port 80 routes to container 8080
  #     depends_on:
  #       - backendapi-service
  #     restart: unless-stopped
  #     networks:
  #       - smart-network 

  metrixapi-service:
    build:
      context: .
      dockerfile: ./MetrixAPI/Dockerfile
    container_name: metrix-metrixapi
    environment:
      - SQL_CONNECTION_STRING=Server=metrix-db;Database=MetrixDB;Trusted_Connection=false;MultipleActiveResultSets=true;Encrypt=false;user id=sa;password=Password1!
      - ASPNETCORE_URLS=http://0.0.0.0:8080  # <-- FORCES C# TO LISTEN ON 8080 INTERNALLY
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8080:8080"
    depends_on:
      metrix-db-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - metrix-network

networks:
  metrix-network:
    driver: bridge

volumes:
  metrix_db_data: