services:

  metrixapi-service:
    build:
      context: .
      dockerfile: ./MetrixAPI/Dockerfile
    container_name: metrix-metrixapi
    environment:
      - ConnectionStrings__DefaultConnection=Server=tcp:metrix-db.database.windows.net,1433;Initial Catalog=MetrixDB;Persist Security Info=False;User ID=metrix;Password=Password1!;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;
      - ConnectionStrings__AzureBlobStorage=DefaultEndpointsProtocol=https;AccountName=metrixstorage;AccountKey=Oae6oHbFWhqaMO8DichyTmeaSjzWjfHCYvw1JqrJrNvVnrgTxws/2GcsUOQOpSq44i2R/ngHsajX+AStVPBHZg==;EndpointSuffix=core.windows.net
      - ASPNETCORE_URLS=http://0.0.0.0:8080 # <-- FORCES C# TO LISTEN ON 8080 INTERNALLY
      - ASPNETCORE_ENVIRONMENT=Development
      - TZ=Africa/Johannesburg # <-- Sets timezone to South Africa to send rule push notifications at noon (Pranjal, 2024)
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - metrix-network

networks:
  metrix-network:
    driver: bridge

